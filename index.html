<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RareFahim Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(0, 255, 136, 0.12),
                    transparent 35%
                ),
                #050505;

            color: white;
        }


        /* LOGIN */

        #loginScreen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            padding: 32px 25px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(0,255,136,0.22);

            border-radius: 24px;

            box-shadow:
                0 0 40px rgba(0,255,136,0.08);

            text-align: center;
        }

        .login-card h1 {
            margin-top: 0;
            color: #00ff88;
        }

        .login-card p {
            color: #aaa;
        }

        input {
            width: 100%;

            margin-top: 12px;
            padding: 14px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.12);

            background: #111;
            color: white;

            outline: none;

            font-size: 15px;
        }

        button {
            border: none;
            cursor: pointer;

            font-size: 14px;

            border-radius: 10px;

            padding: 11px 14px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginBtn {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            background: #00c96b;

            color: #04120b;

            font-weight: bold;
        }

        #loginStatus {
            min-height: 20px;

            margin-top: 15px;

            color: #ff8a8a;

            word-break: break-word;
        }


        /* DASHBOARD */

        #adminDashboard {
            display: none;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;

            z-index: 10;

            padding: 18px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(0,0,0,0.9);

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;

            color: #00ff88;
        }

        #logoutBtn {
            background: rgba(255,80,80,0.15);

            color: #ff9b9b;

            border:
                1px solid rgba(255,80,80,0.25);
        }

        main {
            max-width: 1100px;

            margin: auto;

            padding: 25px 18px 50px;
        }

        h2 {
            margin-top: 30px;
        }


        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 14px;
        }

        .stat-card {
            padding: 20px;

            border-radius: 18px;

            background: rgba(255,255,255,0.05);

            border:
                1px solid rgba(255,255,255,0.08);
        }

        .stat-number {
            display: block;

            margin-top: 8px;

            font-size: 28px;
            font-weight: bold;

            color: #00ff88;
        }


        /* REPORTS */

        .report-list {
            display: grid;
            gap: 14px;
        }

        .report-card {
            padding: 18px;

            border-radius: 18px;

            background: rgba(255,255,255,0.05);

            border:
                1px solid rgba(255,255,255,0.08);
        }

        .report-title {
            color: #ff9b9b;

            font-size: 17px;
            font-weight: bold;
        }

        .report-details {
            margin-top: 12px;

            color: #ccc;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .report-meta {
            margin-top: 15px;

            font-size: 13px;

            color: #999;

            line-height: 1.6;

            word-break: break-word;
        }


        /* BUTTONS */

        .actions {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 18px;
        }

        .view-btn {
            background: #0066cc;
            color: white;
        }

        .disable-btn {
            background: #7a2020;
            color: white;
        }

        .enable-btn {
            background: #126b42;
            color: white;
        }

        .resolve-btn {
            background: #303b75;
            color: white;
        }

        .empty {
            padding: 20px 0;

            color: #888;
        }


        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 17px;
            }

            main {
                padding: 20px 14px 40px;
            }

            button {
                width: 100%;
            }

        }

    </style>
</head>


<body>


<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-card">

        <h1>👑 RareFahim Admin</h1>

        <p>Secure administrator access</p>


        <input
            type="email"
            id="email"
            placeholder="Admin email"
            autocomplete="email"
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button id="loginBtn">
            Login
        </button>


        <p id="loginStatus"></p>

    </div>

</div>



<!-- DASHBOARD -->

<div id="adminDashboard">

    <header>

        <div class="logo">
            👑 RareFahim Admin
        </div>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <main>

        <h2>📊 Dashboard</h2>


        <div class="stats">

            <div class="stat-card">

                Total Surprises

                <span
                    class="stat-number"
                    id="totalSurprises"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                Active

                <span
                    class="stat-number"
                    id="activeSurprises"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                Disabled

                <span
                    class="stat-number"
                    id="disabledSurprises"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                Pending Reports

                <span
                    class="stat-number"
                    id="pendingReports"
                >
                    0
                </span>

            </div>

        </div>


        <h2>🚩 Reports</h2>


        <div
            class="report-list"
            id="reportList"
        >

            <p class="empty">
                Loading reports...
            </p>

        </div>

    </main>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
    "https://ghlomcrgxkvequombpni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_WNWXz8z0_sOyiQRvkKiQPQ_XYIMo0Mq";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginScreen =
    document.getElementById("loginScreen");

const adminDashboard =
    document.getElementById("adminDashboard");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginStatus =
    document.getElementById("loginStatus");

const reportList =
    document.getElementById("reportList");


async function checkAdmin(user) {

    const { data, error } =
        await supabaseClient
            .from("admins")
            .select("id")
            .eq("id", user.id)
            .maybeSingle();


    if (error) {

        console.error(error);

        return false;

    }


    return !!data;

}


function showDashboard() {

    loginScreen.style.display = "none";

    adminDashboard.style.display = "block";

    loadDashboard();

}


loginBtn.addEventListener(
    "click",
    async () => {

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            loginStatus.textContent =
                "Please enter your email and password.";

            return;

        }


        loginBtn.disabled = true;

        loginStatus.style.color = "#aaa";

        loginStatus.textContent =
            "Logging in...";


        const { data, error } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });


        if (error) {

            loginBtn.disabled = false;

            loginStatus.style.color =
                "#ff8a8a";

            loginStatus.textContent =
                error.message;

            return;

        }


        loginStatus.textContent =
            "Checking administrator access...";


        const isAdmin =
            await checkAdmin(data.user);


        if (!isAdmin) {

            await supabaseClient.auth.signOut();

            loginBtn.disabled = false;

            loginStatus.style.color =
                "#ff8a8a";

            loginStatus.textContent =
                "This account is not an administrator.";

            return;

        }


        loginBtn.disabled = false;

        showDashboard();

    }
);


async function loadDashboard() {

    reportList.innerHTML =
        `<p class="empty">Loading reports...</p>`;


    const {
        data: surprises,
        error: surpriseError
    } =
        await supabaseClient
            .from("surprises")
            .select("*");


    const {
        data: reports,
        error: reportError
    } =
        await supabaseClient
            .from("reports")
            .select("*")
            .order(
                "created_at",
                { ascending: false }
            );


    if (surpriseError || reportError) {

        console.error(
            surpriseError,
            reportError
        );

        reportList.innerHTML =
            `<p class="empty">
                ❌ Unable to load dashboard data.
            </p>`;

        return;

    }


    document.getElementById(
        "totalSurprises"
    ).textContent =
        surprises.length;


    document.getElementById(
        "activeSurprises"
    ).textContent =
        surprises.filter(
            surprise =>
                surprise.status === "active"
        ).length;


    document.getElementById(
        "disabledSurprises"
    ).textContent =
        surprises.filter(
            surprise =>
                surprise.status === "disabled"
        ).length;


    document.getElementById(
        "pendingReports"
    ).textContent =
        reports.filter(
            report =>
                report.status !== "resolved"
        ).length;


    if (reports.length === 0) {

        reportList.innerHTML =
            `<p class="empty">
                🎉 No reports yet.
            </p>`;

        return;

    }


    reportList.innerHTML = "";


    reports.forEach(report => {

        const surprise =
            surprises.find(
                item =>
                    item.slug ===
                    report.surprise_slug
            );


        const status =
            surprise
                ? surprise.status || "active"
                : "Not found";


        const date =
            report.created_at
                ? new Date(
                    report.created_at
                ).toLocaleString()
                : "Unknown";


        const card =
            document.createElement("div");


        card.className =
            "report-card";


        card.innerHTML = `

            <div class="report-title">
                🚩 ${escapeHTML(
                    report.reason || "Report"
                )}
            </div>


            <div class="report-details">
                ${
                    escapeHTML(
                        report.details ||
                        "No additional details provided."
                    )
                }
            </div>


            <div class="report-meta">

                <b>Surprise slug:</b>
                ${escapeHTML(report.surprise_slug)}

                <br>

                <b>Surprise status:</b>
                ${escapeHTML(status)}

                <br>

                <b>Reported:</b>
                ${escapeHTML(date)}

                <br>

                <b>Report status:</b>
                ${escapeHTML(
                    report.status || "pending"
                )}

            </div>


            <div class="actions">

                <button
                    class="view-btn"
                    data-action="view"
                    data-slug="${escapeAttribute(
                        report.surprise_slug
                    )}"
                >
                    👁️ View Surprise
                </button>


                ${
                    surprise &&
                    status === "active"

                    ? `

                        <button
                            class="disable-btn"
                            data-action="disable"
                            data-slug="${escapeAttribute(
                                report.surprise_slug
                            )}"
                        >
                            🔴 Disable Surprise
                        </button>

                    `

                    : surprise

                    ? `

                        <button
                            class="enable-btn"
                            data-action="enable"
                            data-slug="${escapeAttribute(
                                report.surprise_slug
                            )}"
                        >
                            🟢 Enable Surprise
                        </button>

                    `

                    : ""
                }


                ${
                    report.status !== "resolved"

                    ? `

                        <button
                            class="resolve-btn"
                            data-action="resolve"
                            data-report-id="${escapeAttribute(
                                report.id
                            )}"
                        >
                            ✅ Resolve Report
                        </button>

                    `

                    : `

                        <button
                            class="resolve-btn"
                            disabled
                        >
                            ✅ Resolved
                        </button>

                    `
                }

            </div>

        `;


        reportList.appendChild(card);

    });


    addActionListeners();

}

    function addActionListeners() {

    document
        .querySelectorAll("[data-action]")
        .forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const action =
                        button.dataset.action;


                    /* VIEW SURPRISE */

                    if (action === "view") {

                        const slug =
                            button.dataset.slug;


                        window.open(
                            "https://rarefahim.github.io/surprise-website-maker/?surprise=" +
                            encodeURIComponent(slug),
                            "_blank"
                        );

                        return;

                    }


                    /* DISABLE */

                    if (action === "disable") {

                        const slug =
                            button.dataset.slug;


                        if (
                            !confirm(
                                "Disable this surprise?\n\nPeople will no longer be able to open it."
                            )
                        ) {

                            return;

                        }


                        button.disabled = true;

                        button.textContent =
                            "Disabling...";


                        const { error } =
                            await supabaseClient
                                .from("surprises")
                                .update({
                                    status: "disabled"
                                })
                                .eq(
                                    "slug",
                                    slug
                                );


                        if (error) {

                            console.error(error);

                            alert(
                                "❌ Could not disable surprise:\n\n" +
                                error.message
                            );

                            button.disabled = false;

                            button.textContent =
                                "🔴 Disable Surprise";

                            return;

                        }


                        alert(
                            "✅ Surprise disabled."
                        );

                        loadDashboard();

                        return;

                    }


                    /* ENABLE */

                    if (action === "enable") {

                        const slug =
                            button.dataset.slug;


                        if (
                            !confirm(
                                "Enable this surprise again?"
                            )
                        ) {

                            return;

                        }


                        button.disabled = true;

                        button.textContent =
                            "Enabling...";


                        const { error } =
                            await supabaseClient
                                .from("surprises")
                                .update({
                                    status: "active"
                                })
                                .eq(
                                    "slug",
                                    slug
                                );


                        if (error) {

                            console.error(error);

                            alert(
                                "❌ Could not enable surprise:\n\n" +
                                error.message
                            );

                            button.disabled = false;

                            button.textContent =
                                "🟢 Enable Surprise";

                            return;

                        }


                        alert(
                            "✅ Surprise enabled."
                        );

                        loadDashboard();

                        return;

                    }


                    /* RESOLVE REPORT */

                    if (action === "resolve") {

                        const reportId =
                            button.dataset.reportId;


                        if (
                            !confirm(
                                "Mark this report as resolved?"
                            )
                        ) {

                            return;

                        }


                        button.disabled = true;

                        button.textContent =
                            "Resolving...";


                        const { error } =
                            await supabaseClient
                                .from("reports")
                                .update({
                                    status: "resolved"
                                })
                                .eq(
                                    "id",
                                    reportId
                                );


                        if (error) {

                            console.error(error);

                            alert(
                                "❌ Could not resolve report:\n\n" +
                                error.message
                            );

                            button.disabled = false;

                            button.textContent =
                                "✅ Resolve Report";

                            return;

                        }


                        alert(
                            "✅ Report resolved."
                        );

                        loadDashboard();

                    }

                }
            );

        });

}


/* SAFE TEXT */

function escapeHTML(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value === null ||
        value === undefined
            ? ""
            : String(value);


    return div.innerHTML;

}


function escapeAttribute(value) {

    return escapeHTML(value)
        .replace(
            /"/g,
            "&quot;"
        );

}


/* LOGOUT */

logoutBtn.addEventListener(
    "click",
    async () => {

        await supabaseClient.auth.signOut();


        adminDashboard.style.display =
            "none";


        loginScreen.style.display =
            "flex";


        loginStatus.textContent =
            "";


        document
            .getElementById("password")
            .value =
            "";

    }
);


/* SESSION CHECK */

async function checkSession() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth
            .getSession();


    if (!session) {

        return;

    }


    const isAdmin =
        await checkAdmin(
            session.user
        );


    if (isAdmin) {

        showDashboard();

    } else {

        await supabaseClient.auth.signOut();

    }

}


/* START */

checkSession();

</script>

</body>
</html>
