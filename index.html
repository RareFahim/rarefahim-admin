<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RareFahim Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(0, 255, 136, .12),
                    transparent 35%
                ),
                #050505;

            color: white;
        }


        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            padding: 32px 25px;

            background: rgba(255,255,255,.06);

            border: 1px solid rgba(0,255,136,.22);

            border-radius: 24px;

            box-shadow:
                0 0 40px rgba(0,255,136,.08);

            backdrop-filter: blur(10px);

            text-align: center;
        }

        .login-card h1 {
            margin-top: 0;
            color: #00ff88;
        }

        .login-card p {
            color: #aaa;
        }

        input {
            width: 100%;

            margin-top: 12px;

            padding: 14px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,.12);

            background: #111;

            color: white;

            outline: none;

            font-size: 15px;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        #loginBtn {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            background: #00c96b;

            color: #04120b;

            font-weight: bold;
        }

        #loginBtn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #loginStatus {
            margin-top: 15px;

            color: #ff8a8a;

            min-height: 20px;

            word-break: break-word;
        }


        /* =========================
           DASHBOARD
        ========================= */

        #adminDashboard {
            display: none;
            min-height: 100vh;
        }

        header {
            padding: 18px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid rgba(255,255,255,.08);

            background: rgba(0,0,0,.35);

            position: sticky;
            top: 0;

            backdrop-filter: blur(12px);

            z-index: 10;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
        }

        #logoutBtn {
            padding: 9px 14px;

            border-radius: 10px;

            background: rgba(255,80,80,.12);

            color: #ff8a8a;

            border:
                1px solid rgba(255,80,80,.2);
        }

        main {
            max-width: 1100px;

            margin: auto;

            padding: 25px 18px 50px;
        }

        h2 {
            margin-top: 30px;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 14px;
        }

        .stat-card {
            padding: 20px;

            border-radius: 18px;

            background: rgba(255,255,255,.05);

            border:
                1px solid rgba(255,255,255,.08);
        }

        .stat-number {
            display: block;

            margin-top: 8px;

            font-size: 28px;

            font-weight: bold;

            color: #00ff88;
        }


        /* =========================
           REPORTS
        ========================= */

        .report-list {
            display: grid;
            gap: 14px;
        }

        .report-card {
            padding: 18px;

            border-radius: 18px;

            background: rgba(255,255,255,.05);

            border:
                1px solid rgba(255,255,255,.08);
        }

        .report-card strong {
            color: #ff9b9b;
        }

        .report-details {
            margin-top: 10px;

            color: #bbb;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .report-meta {
            margin-top: 12px;

            font-size: 13px;

            color: #888;

            word-break: break-word;
        }


        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            margin-top: 15px;
        }

        .disable-btn,
        .enable-btn,
        .resolve-btn {
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
        }

        .disable-btn {
            background: #7a2020;
        }

        .enable-btn {
            background: #126b42;
        }

        .resolve-btn {
            background: #303b75;
        }


        .empty {
            color: #888;
            padding: 20px 0;
        }


        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            main {
                padding: 20px 14px 40px;
            }

            .logo {
                font-size: 17px;
            }

        }

    </style>
</head>


<body>


<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen">

    <div class="login-card">

        <h1>👑 RareFahim Admin</h1>

        <p>
            Secure administrator access
        </p>


        <input
            type="email"
            id="email"
            placeholder="Admin email"
            autocomplete="email"
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button id="loginBtn">
            Login
        </button>


        <p id="loginStatus"></p>

    </div>

</div>



<!-- =========================
     ADMIN DASHBOARD
========================= -->

<div id="adminDashboard">

    <header>

        <div class="logo">
            👑 RareFahim Admin
        </div>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <main>

        <h2>📊 Dashboard</h2>


        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">

                Total Surprises

                <span
                    class="stat-number"
                    id="totalSurprises"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                Active

                <span
                    class="stat-number"
                    id="activeSurprises"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                Disabled

                <span
                    class="stat-number"
                    id="disabledSurprises"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                Pending Reports

                <span
                    class="stat-number"
                    id="pendingReports"
                >
                    0
                </span>

            </div>

        </div>



        <!-- REPORTS -->

        <h2>🚩 Recent Reports</h2>


        <div
            class="report-list"
            id="reportList"
        >

            <p class="empty">
                Loading reports...
            </p>

        </div>

    </main>

</div>



<!-- =========================
     SUPABASE
========================= -->

<script>

/* =========================
